name: Bug
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security reports, use [GitHub Security Advisories](https://github.com/alexiscreuzot/echo/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Logs, Audio MIDI Setup notes, whether the driver was Developer ID signed.
